name: Mirror to Codeberg
on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror push to Codeberg
        env:
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN_FOR_CLONE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN_FOR_CLONE}@github.com/${GH_REPO}.git" repo.git
          cd repo.git
          # GitHub's --mirror also pulls refs/pull/* (one ref per PR) which
          # Codeberg refuses ("deny updating a hidden ref"). Strip them
          # before pushing so the mirror push doesn't exit non-zero.
          git for-each-ref --format='delete %(refname)' refs/pull/             | git update-ref --stdin || true
          git push --mirror "https://${CODEBERG_USER}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_USER}/${REPO_NAME}.git"
